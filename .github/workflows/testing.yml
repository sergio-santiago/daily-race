name: 🔬 Testing

on:
  push:
    branches-ignore: [main]
  workflow_call:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: testing-${{ github.head_ref || github.run_id }}
  cancel-in-progress: true

env:
  NODE_VERSION: '22'

jobs:
  lint:
    name: 🎨 Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup-node-project
        with:
          node-version: ${{ env.NODE_VERSION }}
      - run: npm run lint

  type-check:
    name: 🔍 Type Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup-node-project
        with:
          node-version: ${{ env.NODE_VERSION }}
      - run: npx tsc --noEmit -p packages/backend/tsconfig.json

  test:
    name: ☑️ Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup-node-project
        with:
          node-version: ${{ env.NODE_VERSION }}
      - run: npm test
